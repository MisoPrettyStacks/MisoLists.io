name: Ingest & Publish Pipeline

on:
  push:
    branches: [main]
    paths:
      - "reports/**"
  schedule:
    # Daily at 14:00 UTC (07:00 PT) — re-ingest on a cadence
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: ingest-publish
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ingestion engine
        run: python3 ingest.py

      - name: Commit regenerated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data.js data.db
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): auto-ingest pipeline [skip ci]"
            git push
          fi

      - name: Rebuild GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
